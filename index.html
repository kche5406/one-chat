<!doctype html>

<style>
:root{--bg:#fff8fb;--card:#fff;--ink:#40353d;--muted:#9a8d96;--line:#f0e2ea;--accent:#d98ab0;--danger:#c85e72}
*{box-sizing:border-box}

.composer textarea{min-height:46px;max-height:130px;resize:none;flex:1}.send{width:54px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-weight:900}

<body>
<div class="app">

<section id="setup">
<div class="header"><div class="logo">ONE CHAT</div><div class="sub">개인용 · 설정과 대화를 자동 저장합니다</div></div>

<div class="row" style="justify-content:center;margin-bottom:10px">
<button class="btn" id="loadChar">💾 설정 불러오기</button>
<button class="btn" id="saveChar">📦 설정 백업</button>
<button class="btn" id="loadChat">💬 대화 복구</button>
<button class="btn" id="saveChat">📜 대화 백업</button>
<input id="charFile" type="file" accept=".json" class="hidden">
<input id="chatFile" type="file" accept=".json" class="hidden">
</div>

<h2>🌷 캐릭터 설정</h2>
<div class="hint">입력할 때마다 이 기기에 자동 저장됩니다.</div>
<div class="avatar" id="charPrev">🖼️</div>
<div class="row">
<button class="btn" id="charUpload">이미지 업로드</button>

<input id="charImg" type="file" accept="image/*" class="hidden">

<div class="field"><label>나이</label><input id="age"></div>
</div>

<div class="field"><label>성격</label><textarea id="personality"></textarea></div>

<div class="field"><label>말버릇 / 즐겨 쓰는 표현</label><textarea id="habits"></textarea></div>
<div class="field"><label>절대 쓰지 않는 표현</label><textarea id="forbidden"></textarea></div>
<div class="field"><label>캐릭터 서사 / 배경</label><textarea id="backstory"></textarea></div>
<div class="field"><label>세계관 / 무대</label><textarea id="world"></textarea></div>

<button class="btn" id="userUpload">이미지 업로드</button>

<div class="row">
<button class="btn primary" id="profileOn">프로필 표시</button>

</section>

<button class="btn" id="back">설정</button>

<p class="hint">현재 대화만 삭제합니다. 캐릭터 설정은 남습니다.</p>
<div class="row" style="justify-content:flex-end">
<button class="btn" id="cancel">취소</button>
<button class="btn primary" id="yes">삭제하고 시작</button>
</div>
</div>
</div>

<script>
const ids=['name','gender','age','personality','speech','habits','forbidden','backstory','world','call','userInfo','opening'];
const MODELS=['gemini-2.5-flash','gemini-3.1-flash-lite'];
let currentModel=0,charImage='',userImage='',history=[],busy=false,profileVisible=true;
const $=id=>document.getElementById(id),key='onechat_v3_settings',chatKey='onechat_v3_chat';
const text=id=>$(id).value.trim();

function compress(file){
return new Promise((resolve,reject)=>{
const r=new FileReader();
r.onload=()=>{const im=new Image();im.onload=()=>{
const s=Math.min(1,420/Math.max(im.width,im.height)),c=document.createElement('canvas');
c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
resolve(c.toDataURL('image/jpeg',.82));};im.onerror=reject;im.src=r.result};
r.onerror=reject;r.readAsDataURL(file);
});
}

function settings(){
let o={};ids.forEach(i=>o[i]=text(i));
o.charImage=charImage;o.userImage=userImage;o.profileVisible=profileVisible;return o;
}

function apply(o){
ids.forEach(i=>{if(o[i]!==undefined)$(i).value=o[i]});
charImage=o.charImage||'';userImage=o.userImage||'';
if(o.profileVisible!==undefined)profileVisible=o.profileVisible;
preview();
}

function preview(){
$('charPrev').innerHTML=charImage?`<img src="${charImage}">`:'🖼️';
$('userPrev').innerHTML=userImage?`<img src="${userImage}">`:'🖼️';
$('chatPrev').innerHTML=charImage?`<img src="${charImage}">`:'🌷';
$('profileOn').classList.toggle('primary',profileVisible);
$('profileOff').classList.toggle('primary',!profileVisible);
}

function saveLocal(){
try{localStorage.setItem(key,JSON.stringify(settings()))}
catch{$('status').textContent='⚠️ 저장 공간이 부족합니다.'}
}

function loadLocal(){
try{const s=localStorage.getItem(key);if(s)apply(JSON.parse(s))}catch{}
}

ids.forEach(i=>$(i).addEventListener('input',saveLocal));

$('charUpload').onclick=()=>$('charImg').click();
$('userUpload').onclick=()=>$('userImg').click();

$('charImg').onchange=async e=>{
if(e.target.files[0]){charImage=await compress(e.target.files[0]);preview();saveLocal()}
};

$('userImg').onchange=async e=>{
if(e.target.files[0]){userImage=await compress(e.target.files[0]);preview();saveLocal()}
};

$('charRemove').onclick=()=>{charImage='';preview();saveLocal()};
$('userRemove').onclick=()=>{userImage='';preview();saveLocal()};

$('profileOn').onclick=()=>{profileVisible=true;preview();saveLocal();render()};
$('profileOff').onclick=()=>{profileVisible=false;preview();saveLocal();render()};

function download(data,name){
const a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}

$('saveChar').onclick=()=>{
const o=settings();delete o.apiKey;
download(JSON.stringify(o,null,2),(text('name')||'character')+'-settings.json');
};

$('loadChar').onclick=()=>$('charFile').click();

$('charFile').onchange=async e=>{
try{apply(JSON.parse(await e.target.files[0].text()));saveLocal();alert('설정을 불러왔습니다.')}
catch{alert('설정 파일을 읽지 못했습니다.')}
e.target.value='';
};

function system(){
return `당신은 "${text('name')||'캐릭터'}"이다.

아래 캐릭터 설정을 최우선으로 유지한다.

성별: ${text('gender')}
나이: ${text('age')}

성격:
${text('personality')}

말투/어미:
${text('speech')}

말버릇:
${text('habits')}

절대 사용하지 않는 표현:
${text('forbidden')}

캐릭터 서사:
${text('backstory')}

세계관:
${text('world')}

유저 호칭:
${text('call')}

유저 정보/관계:
${text('userInfo')}

시작 상황:
${text('opening')}

실제 대화처럼 자연스럽게 답한다.
캐릭터의 말투와 성격을 일관되게 유지한다.
대사와 지문을 자연스럽게 섞어 장면이 눈앞에 보이는 것처럼 작성한다.
지문에는 표정, 시선, 몸짓, 자세, 감정 등을 적절히 활용한다.
지나치게 짧게 답하지 않는다.
문장을 작성하다가 갑자기 끊지 않는다.
반드시 완성된 문장으로 답변을 끝낸다.
이전 대화의 맥락과 관계를 기억하면서 자연스럽게 이어간다.`;
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function request(contents){
const k=text('apiKey');
if(!k)throw Error('API 키를 입력해주세요.');

for(let mi=currentModel;mi<MODELS.length;mi++){
const m=MODELS[mi];

for(let attempt=0;attempt<3;attempt++){
try{
const r=await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`,
{
method:'POST',
headers:{'Content-Type':'application/json','x-goog-api-key':k},
body:JSON.stringify({
systemInstruction:{parts:[{text:system()}]},
contents,
generationConfig:{temperature:1,maxOutputTokens:2500}
})
}
);

let d={};try{d=await r.json()}catch{}

if(r.ok){
const c=d?.candidates?.[0],answer=(c?.content?.parts||[]).map(x=>x.text||'').join('');
if(answer.trim()){
currentModel=mi;
return{text:answer,finishReason:c?.finishReason||''};
}
if(attempt<2){await sleep(1500*(attempt+1));continue}
throw Error('응답이 비어 있습니다.');
}

const status=d?.error?.status||'API 오류';
const message=d?.error?.message||'요청에 실패했습니다.';
const quota=r.status===429||status==='RESOURCE_EXHAUSTED'||/quota|rate.?limit|resource.?exhausted/i.test(message);

if(quota)break;

if((r.status===500||r.status===503)&&attempt<2){
await sleep(2000*(attempt+1));continue;
}

throw Error(`${status}: ${message}`);

}catch(e){
if(attempt<2&&(e.name==='TypeError'||/fetch|network|networkerror/i.test(e.message))){
await sleep(2000*(attempt+1));continue;
}
throw e;
}
}
}

currentModel=0;
throw Error('⚠️ 사용할 수 있는 모델의 사용량이 모두 초과되었습니다.');
}

async function generateReply(){
let working=[...history],combined='',chunks=0;

while(chunks<3){
const r=await request(working);
combined+=r.text;
if(r.finishReason!=='MAX_TOKENS')break;

chunks++;
working=[
...working,
{role:'model',parts:[{text:r.text}]},
{role:'user',parts:[{text:'방금 답변이 생성 도중 잘렸습니다. 앞의 내용을 반복하지 말고 자연스럽게 이어서 작성해주세요. 완성된 문장으로 끝내주세요.'}]}
];
}
return combined;
}

function saveChat(){
try{localStorage.setItem(chatKey,JSON.stringify({history,turn:history.length}))}catch{}
}

function loadChatLocal(){
try{
const d=JSON.parse(localStorage.getItem(chatKey)||'null');
if(d?.history){history=d.history;render();return true}
}catch{}
return false;
}

function render(){
$('messages').innerHTML='';
history.forEach(x=>addVisual(x.role==='user'?'user':'ai',x.parts?.[0]?.text||x.text||''));
$('turn').textContent=`${Math.floor(history.length/2)}턴 · 자동 저장됨`;
}

function addVisual(role,t){
const row=document.createElement('div');
row.className='msg '+role;

if(profileVisible&&role!=='user'){
const av=document.createElement('div');av.className='msgAvatar';
av.innerHTML=charImage?`<img src="${charImage}">`:'🌷';row.appendChild(av);
}

const b=document.createElement('div');b.className='bubble';b.textContent=t;row.appendChild(b);

if(profileVisible&&role==='user'){
const av=document.createElement('div');av.className='msgAvatar';
av.innerHTML=userImage?`<img src="${userImage}">`:'♡';row.appendChild(av);
}

$('messages').appendChild(row);
window.scrollTo(0,document.body.scrollHeight);
}

function add(role,t){
history.push({role,parts:[{text:t}]});
addVisual(role==='user'?'user':'ai',t);saveChat();
}

function addError(message,retry){
const row=document.createElement('div');row.className='msg ai';
if(profileVisible){
const av=document.createElement('div');av.className='msgAvatar';av.textContent='🌷';row.appendChild(av);
}
const box=document.createElement('div');box.className='bubble';
const tx=document.createElement('div');tx.textContent='⚠️ '+message;
const btn=document.createElement('button');btn.className='retryBtn';btn.textContent='↻ 재시도';
btn.onclick=async()=>{
btn.disabled=true;btn.textContent='재시도 중…';
try{row.remove();await retry()}catch{btn.disabled=false;btn.textContent='↻ 재시도'}
};
box.append(tx,btn);row.appendChild(box);$('messages').appendChild(row);
}

async function sendMessage(t){
if(busy||!t.trim())return;
busy=true;$('send').disabled=true;add('user',t);

const wait=document.createElement('div');wait.className='msg ai';
wait.innerHTML=profileVisible?'<div class="msgAvatar">🌷</div><div class="bubble">생각 중…</div>':'<div class="bubble">생각 중…</div>';
$('messages').appendChild(wait);

try{const reply=await generateReply();wait.remove();add('model',reply)}
catch(e){wait.remove();addError(e.message,sendRetry)}
finally{busy=false;$('send').disabled=false;$('input').focus()}
}

async function sendRetry(){
if(busy)return;
busy=true;
if(history[history.length-1]?.role!=='user'){busy=false;return}

const wait=document.createElement('div');wait.className='msg ai';
wait.innerHTML=profileVisible?'<div class="msgAvatar">🌷</div><div class="bubble">다시 생각 중…</div>':'<div class="bubble">다시 생각 중…</div>';
$('messages').appendChild(wait);

try{const reply=await generateReply();wait.remove();add('model',reply)}
catch(e){wait.remove();addError(e.message,sendRetry)}
finally{busy=false}
}

async function begin(){
if(!text('name'))return alert('캐릭터 이름을 입력해주세요.');
if(!text('apiKey'))return alert('Gemini API 키를 입력해주세요.');

$('setup').style.display='none';$('chat').classList.add('active');
$('chatTitle').textContent=text('name');preview();

if(!loadChatLocal()&&text('opening')){
history=[{role:'user',parts:[{text:`[시작 상황]\n${text('opening')}\n\n이 장면에서 캐릭터로 먼저 말을 걸어줘. 지문과 대사를 충분히 자세하게 작성해줘.`}]}];
saveChat();

const wait=document.createElement('div');wait.className='msg ai';
wait.innerHTML=profileVisible?'<div class="msgAvatar">🌷</div><div class="bubble">생각 중…</div>':'<div class="bubble">생각 중…</div>';
$('messages').appendChild(wait);

try{const r=await generateReply();wait.remove();add('model',r)}
catch(e){wait.remove();addError(e.message,async()=>{try{const r=await generateReply();add('model',r)}catch(x){addError(x.message,arguments.callee)}})}
}
}

$('test').onclick=async()=>{
const s=$('status');s.textContent='연결 테스트 중…';
try{
const old=history;history=[];
await request([{role:'user',parts:[{text:'짧게 자기소개를 해줘.'}]}]);
history=old;
s.textContent=`✅ 연결 성공 · ${MODELS[currentModel]}`;
}catch(e){s.textContent='❌ '+e.message}
};

$('start').onclick=begin;

$('back').onclick=()=>{
$('chat').classList.remove('active');$('setup').style.display='block';saveLocal();saveChat();
};

$('send').onclick=()=>{const t=text('input');$('input').value='';sendMessage(t)};

$('input').addEventListener('keydown',e=>{
if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}
});

$('new').onclick=()=>$('modal').classList.add('show');
$('cancel').onclick=()=>$('modal').classList.remove('show');

$('yes').onclick=()=>{
$('modal').classList.remove('show');history=[];localStorage.removeItem(chatKey);render();
};

$('saveChat').onclick=()=>{
download(JSON.stringify({version:4,savedAt:new Date().toISOString(),character:text('name'),history},null,2),(text('name')||'chat')+'-conversation.json');
};

$('loadChat').onclick=()=>$('chatFile').click();

$('chatFile').onchange=async e=>{
try{
const d=JSON.parse(await e.target.files[0].text());history=d.history||[];saveChat();render();alert('대화를 복구했습니다.');
}catch{alert('대화 백업 파일을 읽지 못했습니다.')}
e.target.value='';
};

window.addEventListener('beforeunload',()=>{saveLocal();saveChat()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveLocal();saveChat()}});

function updateKeyboardPosition(){
const vv=window.visualViewport;
const o=vv?Math.max(0,window.innerHeight-vv.height-vv.offsetTop):0;
document.documentElement.style.setProperty('--keyboard-offset',`${o}px`);
}

if(window.visualViewport){
visualViewport.addEventListener('resize',updateKeyboardPosition);
visualViewport.addEventListener('scroll',updateKeyboardPosition);
}

$('input').addEventListener('focus',()=>{setTimeout(updateKeyboardPosition,100);setTimeout(updateKeyboardPosition,300)});
$('input').addEventListener('blur',()=>setTimeout(()=>document.documentElement.style.setProperty('--keyboard-offset','0px'),150));
window.addEventListener('resize',updateKeyboardPosition);

loadLocal();
loadChatLocal();
preview();
updateKeyboardPosition();
</script>
