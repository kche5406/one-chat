<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3faff">
<title>ONE CHAT</title>
<style>
:root{--bg:#f5fbff;--ink:#35424b;--muted:#8b9aa3;--line:#dfeef5;--a:#82c9e8;--a2:#62b5d8;--danger:#c85e72}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f2faff,#fff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:14px 14px 30px}
.header{text-align:center;padding:10px 0 18px}.logo{font-weight:900;letter-spacing:.13em;font-size:28px}
.hint,.sub,.notice,.turn{font-size:12px;color:var(--muted);line-height:1.5}.card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:17px;margin:12px 0;box-shadow:0 10px 35px #3782a010}
h2{font-size:17px;margin:0 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px;background:#fff;color:var(--ink);outline:0}textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{padding:10px 13px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--ink)}.primary,.start{background:var(--a);color:#fff;border-color:var(--a)}.danger{color:var(--danger)}
.avatar{width:88px;height:88px;border-radius:23px;background:#eefaff;border:1px dashed #c5e5f1;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:9px 0}.avatar img{width:100%;height:100%;object-fit:cover}
.hidden{display:none!important}.start{width:100%;border:0;padding:15px;border-radius:17px;font-weight:900;font-size:16px;margin-top:9px}
#chat{display:none;min-height:100vh}#chat.active{display:flex;flex-direction:column}
.chatHeader{position:sticky;top:0;z-index:5;background:#f5fbffef;backdrop-filter:blur(10px)}.chatTop{display:flex;gap:9px;align-items:center;padding:8px 0 6px}.chatName{font-weight:900}
.chatInfo{font-size:10px;color:var(--muted);padding:2px 0 8px;display:flex;flex-wrap:wrap;gap:4px 10px}
.messages{padding:6px 0 100px}.msg{display:flex;margin:13px 0}.msg.user{justify-content:flex-end}.bubble{max-width:84%;padding:12px 15px;border-radius:18px;white-space:pre-wrap;word-break:break-word;line-height:1.65}
.ai .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}.user .bubble{background:#b9e5f5;color:#294653;border-bottom-right-radius:6px}
.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);padding:9px 14px calc(9px + env(safe-area-inset-bottom));background:#f5fbfff5;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;gap:8px;z-index:6}
.composer textarea{min-height:46px;max-height:130px;resize:none;flex:1}.send{width:54px;border:0;border-radius:16px;background:var(--a2);color:#fff;font-weight:900}
.modal{position:fixed;inset:0;background:#1e3c4a4d;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.modalBox{background:#fff;border-radius:22px;padding:20px;max-width:440px;width:100%}
.retry{margin-top:8px;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.app{padding:12px}.card{padding:15px}}
</style>
</head>
<body>
<div class="app">

<section id="setup">
<div class="header"><div class="logo">ONE CHAT</div><div class="sub">개인용 · 설정과 대화를 자동 저장합니다</div></div>

<div class="row" style="justify-content:center;margin-bottom:10px">
<button class="btn" id="loadChar">설정 불러오기</button><button class="btn" id="saveChar">설정 백업</button>
<button class="btn" id="loadChat">대화 복구</button><button class="btn" id="saveChat">대화 백업</button>
<input id="charFile" type="file" accept=".json" class="hidden"><input id="chatFile" type="file" accept=".json" class="hidden">
</div>

<div class="card">
<h2>캐릭터 설정</h2><div class="hint">입력할 때마다 자동 저장됩니다.</div>
<div class="avatar" id="charPrev">이미지</div>
<div class="row"><button class="btn" id="charUpload">이미지 업로드</button><button class="btn danger" id="charRemove">삭제</button><input id="charImg" type="file" accept="image/*" class="hidden"></div>
<div class="grid">
<div class="field"><label>이름 *</label><input id="name"></div><div class="field"><label>성별</label><input id="gender"></div>
<div class="field"><label>나이</label><input id="age"></div>
<div class="field"><label>모델</label><select id="model"><option value="auto">자동 관리</option><option value="gemini-2.5-flash">Gemini 2.5 Flash</option><option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option></select></div>
</div>
<div class="field"><label>성격</label><textarea id="personality"></textarea></div>
<div class="field"><label>말투 / 어미</label><textarea id="speech"></textarea></div>
<div class="field"><label>말버릇 / 즐겨 쓰는 표현</label><textarea id="habits"></textarea></div>
<div class="field"><label>절대 쓰지 않는 표현</label><textarea id="forbidden"></textarea></div>
<div class="field"><label>캐릭터 서사 / 배경</label><textarea id="backstory"></textarea></div>
<div class="field"><label>세계관 / 무대</label><textarea id="world"></textarea></div>
<div class="field"><label>세계관 자료 링크</label><input id="worldUrl"><button class="btn" id="readWorld" style="margin-top:7px">자료 읽기</button><div id="worldStatus" class="notice"></div></div>
</div>

<div class="card">
<h2>유저 설정</h2>
<div class="avatar" id="userPrev">이미지</div>
<div class="row"><button class="btn" id="userUpload">이미지 업로드</button><button class="btn danger" id="userRemove">삭제</button><input id="userImg" type="file" accept="image/*" class="hidden"></div>
<div class="field"><label>유저 호칭</label><input id="call"></div><div class="field"><label>유저 정보 / 관계</label><textarea id="userInfo"></textarea></div>
</div>

<div class="card"><h2>시작 상황</h2><textarea id="opening"></textarea></div>

<div class="card">
<h2>Gemini API</h2><input id="apiKey" type="password" placeholder="API 키를 입력하세요">
<div class="notice">API 키는 이 기기에만 저장되며 설정 백업에는 포함되지 않습니다.</div>
<button class="btn" id="test" style="margin-top:10px">연결 테스트</button><div id="status" class="notice"></div>
</div>
<button class="start" id="start">대화 시작</button>
</section>

<section id="chat">
<div class="chatHeader"><div class="chatTop">
<button class="btn" id="back">설정</button><div><div class="chatName" id="chatTitle">캐릭터</div><div class="turn" id="turn"></div></div>
<button class="btn" id="new" style="margin-left:auto">새 대화</button>
</div><div class="chatInfo"><span id="loc">위치: -</span><span id="tim">시간: -</span><span id="sit">상황: -</span></div></div>
<div class="messages" id="messages"></div>
<div class="composer"><textarea id="input" placeholder="메시지를 입력하세요..." rows="1"></textarea><button class="send" id="send">전송</button></div>
</section>
</div>

<div class="modal" id="modal"><div class="modalBox"><h3>새 대화를 시작할까요?</h3><p class="hint">현재 대화만 삭제합니다.</p><div class="row" style="justify-content:flex-end"><button class="btn" id="cancel">취소</button><button class="btn primary" id="yes">삭제하고 시작</button></div></div></div>

<script>
const ids=['name','gender','age','model','personality','speech','habits','forbidden','backstory','world','worldUrl','call','userInfo','opening'];
const $=x=>document.getElementById(x),T=x=>$(x).value.trim();
const SK='onechat_settings',CK='onechat_chat',AK='onechat_api';
const models=['gemini-2.5-flash','gemini-3.1-flash-lite'];
let history=[],busy=false,currentModel=0,state={location:'-',time:'-',situation:'-'};

function settings(){let o={};ids.forEach(x=>o[x]=$(x).value);o.charImage=window.cimg||'';o.userImage=window.uimg||'';return o}
function save(){localStorage.setItem(SK,JSON.stringify(settings()));localStorage.setItem(AK,T('apiKey'))}
function load(){try{let o=JSON.parse(localStorage.getItem(SK)||'null');if(o){ids.forEach(x=>{if(o[x]!=null)$(x).value=o[x]});window.cimg=o.charImage||'';window.uimg=o.userImage||'';preview()}}catch{}$( 'apiKey').value=localStorage.getItem(AK)||''}
function preview(){$('charPrev').innerHTML=window.cimg?`<img src="${window.cimg}">`:'이미지';$('userPrev').innerHTML=window.uimg?`<img src="${window.uimg}">`:'이미지'}
ids.forEach(x=>$(x).oninput=save);$('apiKey').oninput=save;

function compress(f){return new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>{let i=new Image;i.onload=()=>{let s=Math.min(1,420/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
$('charUpload').onclick=()=>$('charImg').click();$('userUpload').onclick=()=>$('userImg').click();
$('charImg').onchange=async e=>{if(e.target.files[0]){window.cimg=await compress(e.target.files[0]);preview();save()}}
$('userImg').onchange=async e=>{if(e.target.files[0]){window.uimg=await compress(e.target.files[0]);preview();save()}}
$('charRemove').onclick=()=>{window.cimg='';preview();save()};$('userRemove').onclick=()=>{window.uimg='';preview();save()};

function sys(){return `당신은 "${T('name')||'캐릭터'}"이다.
성별:${T('gender')} 나이:${T('age')}
성격:${T('personality')}
말투:${T('speech')}
말버릇:${T('habits')}
금지 표현:${T('forbidden')}
서사:${T('backstory')}
세계관:${T('world')}
유저 호칭:${T('call')}
유저 정보/관계:${T('userInfo')}

현재 상태:
위치:${state.location}
시간:${state.time}
상황:${state.situation}

설정을 최우선으로 유지하며 자연스러운 대화와 지문을 작성한다.
현재 상태는 대화 내용을 보고 자동으로 갱신한다.
위치는 반드시 "큰 장소 - 세부 장소" 형식으로 한다.
예: 집 - 부엌 / 집 - 안방 / 집 - 거실 / 회사 - 사무실 / 거리 - 카페 / 거리 - 공원
식탁, 소파, 침대, 창가 같은 가구나 물건은 위치로 쓰지 않는다.
시간은 반드시 다음 네 가지 중 하나만 사용한다: 오전 / 점심 / 오후 / 새벽
상황은 현재 행동이나 분위기를 짧게 적는다.
실제 변화가 있을 때만 상태를 변경한다.
답변 끝에 상태를 붙인다:
[STATE]
위치: ...
시간: ...
상황: ...
[/STATE]
STATE는 화면에 표시하지 않는다.`}

async function api(model,contents){let r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':T('apiKey')},body:JSON.stringify({systemInstruction:{parts:[{text:sys()}]},contents,generationConfig:{temperature:1,maxOutputTokens:2200}})});let d=await r.json().catch(()=>({}));return{r,d}}

async function ask(contents){
if(!T('apiKey'))throw Error('API 키를 입력해주세요.');
let list=T('model')==='auto'?models:[T('model')];
for(let i=0;i<list.length;i++){let m=list[(currentModel+i)%list.length],x=await api(m,contents);
if(x.r.ok){let c=x.d?.candidates?.[0],a=c?.content?.parts?.map(p=>p.text||'').join('');if(a){currentModel=(models.indexOf(m)+1)%models.length;return{a,finish:c?.finishReason||''}}}
if(x.r.status!==429)throw Error(x.d?.error?.message||'API 오류')}
throw Error('사용 가능한 모델의 사용량이 부족합니다.')}

function stateParse(s){
let m=s.match(/\[STATE\]([\s\S]*?)\[\/STATE\]/i);
if(m){let z=m[1],a=z.match(/위치\s*:\s*(.+)/),b=z.match(/시간\s*:\s*(.+)/),c=z.match(/상황\s*:\s*(.+)/);if(a)state.location=a[1].trim();if(b)state.time=b[1].trim();if(c)state.situation=c[1].trim();update();s=s.replace(m[0],'').trim()}return s}
function overlap(a,b){for(let n=Math.min(100,a.length,b.length);n>=15;n--)if(a.slice(-n).trim()===b.slice(0,n).trim())return b.slice(n);return b}
async function reply(){
let w=[...history],out='';
for(let n=0;n<3;n++){let r=await ask(w),a=stateParse(r.a);out+=out?overlap(out,a):a;if(r.finish!=='MAX_TOKENS')break;w=[...w,{role:'model',parts:[{text:r.a}]},{role:'user',parts:[{text:'앞의 내용을 반복하지 말고 바로 이어서 완성해주세요.'}]}]}return out}

function saveChat(){try{localStorage.setItem(CK,JSON.stringify({history,state}))}catch{}}
function update(){$('loc').textContent='위치: '+state.location;$('tim').textContent='시간: '+state.time;$('sit').textContent='상황: '+state.situation}
function add(role,t){history.push({role,parts:[{text:t}]});let d=document.createElement('div');d.className='msg '+(role==='user'?'user':'ai');d.innerHTML='<div class="bubble"></div>';d.firstChild.textContent=t;$('messages').appendChild(d);saveChat();$('turn').textContent=Math.floor(history.length/2)+'턴 · 자동 저장됨';window.scrollTo(0,document.body.scrollHeight)}
function render(){
$('messages').innerHTML='';
let start=Math.max(0,history.length-80);
history.slice(start).forEach(x=>{let d=document.createElement('div');d.className='msg '+(x.role==='user'?'user':'ai');d.innerHTML='<div class="bubble"></div>';d.firstChild.textContent=x.parts?.[0]?.text||'';$('messages').appendChild(d)});
$('turn').textContent=Math.floor(history.length/2)+'턴 · 자동 저장됨';window.scrollTo(0,document.body.scrollHeight)
}

async function send(t){
if(busy||!t)return;busy=true;$('send').disabled=true;add('user',t);
try{add('model',await reply())}catch(e){let d=document.createElement('div');d.className='msg ai';d.innerHTML='<div class="bubble"></div>';d.firstChild.textContent=e.message;$('messages').appendChild(d)}finally{busy=false;$('send').disabled=false}
}

$('start').onclick=async()=>{
save();$('setup').style.display='none';$('chat').classList.add('active');$('chatTitle').textContent=T('name');
try{let d=JSON.parse(localStorage.getItem(CK)||'null');if(d?.history?.length){history=d.history;state=d.state||state;render();update();return}}catch{}
history=[];state={location:'-',time:'-',situation:'-'};update();
if(T('opening')){history=[{role:'user',parts:[{text:'[시작 상황]\n'+T('opening')+'\n\n이 장면에서 먼저 말을 걸어줘.'}]}];try{add('model',await reply())}catch(e){add('model',e.message)}}
};

$('back').onclick=()=>{$('chat').classList.remove('active');$('setup').style.display='block';save();saveChat()};
$('send').onclick=()=>{let t=T('input');$('input').value='';send(t)};
$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}};
$('new').onclick=()=>$('modal').classList.add('show');$('cancel').onclick=()=>$('modal').classList.remove('show');
$('yes').onclick=()=>{localStorage.removeItem(CK);history=[];state={location:'-',time:'-',situation:'-'};update();render();$('modal').classList.remove('show')};

$('test').onclick=async()=>{try{await ask([{role:'user',parts:[{text:'짧게 자기소개해줘.'}]}]);$('status').textContent='연결 성공!'}catch(e){$('status').textContent=e.message}};
$('saveChar').onclick=()=>{let o=settings();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download=(T('name')||'character')+'-settings.json';a.click()};
$('loadChar').onclick=()=>$('charFile').click();$('charFile').onchange=async e=>{try{let o=JSON.parse(await e.target.files[0].text());ids.forEach(x=>{if(o[x]!=null)$(x).value=o[x]});window.cimg=o.charImage||'';window.uimg=o.userImage||'';save();preview();alert('설정을 불러왔습니다.')}catch{alert('설정 파일을 읽지 못했습니다.')}};
$('saveChat').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({history,state},null,2)],{type:'application/json'}));a.download='conversation.json';a.click()};
$('loadChat').onclick=()=>$('chatFile').click();$('chatFile').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());history=d.history||[];state=d.state||state;saveChat();render();update();alert('대화를 복구했습니다.')}catch{alert('대화 파일을 읽지 못했습니다.')}};

$('readWorld').onclick=async()=>{let u=T('worldUrl');if(!u)return;$('worldStatus').textContent='읽는 중…';try{let r=await fetch(u),d=new DOMParser().parseFromString(await r.text(),'text/html');d.querySelectorAll('script,style,noscript,svg').forEach(x=>x.remove());let s=(d.body?.innerText||'').replace(/\s+/g,' ').trim().slice(0,12000);$('world').value=T('world')+'\n\n[외부 자료]\n'+s;save();$('worldStatus').textContent='추가했습니다.'}catch{$('worldStatus').textContent='읽지 못했습니다.'}};

load();preview();update();
</script>
</body>
</html>
